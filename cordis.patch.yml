# dsh-ace bundle patch: insert the dual-face ACE row into the profile roster.
# The Node half (exports ".") serves /composer-predict/* for backward
# compatibility with the previous route; the `dsh.client` declaration in
# package.json makes the browser half (exports "./client") load in the web GUI.
- insert:
    - id: ace
      name: "@ghoscro/dsh-ace"
